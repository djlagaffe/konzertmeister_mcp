[project]
name = "konzertmeister-mcp"
version = "1.0.0"
description = "MCP server for the Konzertmeister scheduling app"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
konzertmeister-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
